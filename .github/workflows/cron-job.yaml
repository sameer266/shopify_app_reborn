name: Cron Job

on:
  schedule:
    - cron: "*/55 * * * *"   # every 5 minutes (your comment was wrong)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"   # better than 23 for stability

      - name: Install dependencies
        working-directory: app/cron
        run: npm ci        

      - name: Run script
        env:
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          GCP_FIREBASE_PRIVATE_KEY: ${{ secrets.GCP_FIREBASE_PRIVATE_KEY }}

        run: node app/cron/cron.js